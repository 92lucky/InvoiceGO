services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: inv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: LuckyCode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  pgdata:
