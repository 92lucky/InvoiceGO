<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Invoice Generator</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <style>
    .alert-success {
      background: #e8f7ee;
      color: #1e7f4f;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #bfe8d0;
      font-size: 14px;
    }
  </style>
  <body style="text-align: center">
    <div class="container">
      <h1>Invoice Generator</h1>
      {{if .success}}
      <div class="alert-success">✔ Profil berhasil disimpan</div>
      {{end}}

      <form hx-post="/generate" hx-target="#invoice" hx-swap="innerHTML">
        <div class="form-group">
          <label>No Invoice:</label>
          <input name="invoice_number" required />
        </div>

        <div class="form-group">
          <label>Periode:</label>
          <input type="text" name="periode" placeholder="contoh: Juli 2025" />
        </div>

        <div class="form-group">
          <label>Tanggal:</label>
          <input type="date" name="invoice_date" required />
        </div>

        <div class="form-group">
          <label>Quantity (Kg):</label>
          <input
            type="number"
            name="quantity_kg"
            step="any"
            placeholder="Jumlah Angkut Armada"
            required
          />
        </div>

        <div class="form-group">
          <label>DPP Dari Efaktur Pajak :</label>
          <input
            type="number"
            name="dpp"
            step="any"
            placeholder="isi tanpa simbol"
          />
        </div>

        <div>
          <button type="submit">Print</button>
        </div>
      </form>
    </div>

    <div style="text-align: center">
      <a href="/dashboard">dashboard</a>
    </div>
  </body>
  <script>
    setTimeout(() => {
      const el = document.querySelector(".alert-success");
      if (el) el.remove();
    }, 3000);
  </script>
</html>
