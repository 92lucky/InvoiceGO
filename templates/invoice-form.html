<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Invoice Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/invoice.css" />
    <style>
     
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
  }

  .app {
    display: flex;
    width: 100%;
    height: 100vh;
  }

  /* SIDEBAR 30% */
  .sidebar {
    width: 30%;
    min-width: 300px;
    background: #ffffff;
    padding: 30px;
    border-right: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
  }

  /* MAIN CONTENT 70% */

  .back-btn {
  position: absolute;
  bottom: 20px;
  left: 30px;
  padding: 6px 14px;
  background: #e5e7eb;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.2s ease;
}

.back-btn:hover {
  background: #d1d5db;
}

  .main-content {
    width: 70%;
    padding: 0;
    background: #eef1f5;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .preview-wrapper {
    width: 95%;
    height: 95%;
    background: white;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }

  .preview-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 16px;
  }

  .form-group label {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
  }

  .form-group input {
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  .action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  .action-buttons button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: white;
  }

  .preview-btn {
    background: #2563eb;
  }

  .download-btn {
    background: #16a34a;
  }
</style> 
  <body>
    <!-- Tombol Back di luar form -->

    <div class="app">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <h2>Invoice Generator</h2>

        <form id="invoice-form">
          <div class="form-group">
            <label>No Invoice</label>
            <input name="invoice_number" required />
          </div>

          <div class="form-group">
            <label>Periode</label>
            <input type="text" name="periode" />
          </div>

          <div class="form-group">
            <label>Tanggal</label>
            <input type="date" name="invoice_date" required />
          </div>

          <div class="form-group">
            <label>Quantity (Kg)</label>
            <input type="number" name="quantity_kg" step="any" required />
          </div>

          <div class="action-buttons">
            <button type="button" class="preview-btn" onclick="previewPDF()">
              Preview
            </button>
            <button type="button" class="download-btn" onclick="downloadPDF()">
              Download
            </button>
          </div>
        </form>

        <button class="back-btn" onclick="window.location.href='/dashboard'">
          Back
        </button>

      <!-- MAIN CONTENT -->
      <div class="main-content">
        <div class="preview-wrapper">
          <iframe id="pdfViewer"></iframe>
        </div>
      </div>
    </div>
    <script>
      setTimeout(() => {
        const el = document.querySelector(".alert-success");
        if (el) el.remove();
      }, 3000);

      async function previewPDF() {
        const form = document.getElementById("invoice-form");
        const formData = new FormData(form);

        const response = await fetch("/invoice/pdf", {
          method: "POST",
          body: formData,
        });

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        document.getElementById("pdfViewer").src = url;
      }

      async function downloadPDF() {
        const form = document.getElementById("invoice-form");
        const formData = new FormData(form);

        const response = await fetch("/invoice/pdf?download=true", {
          method: "POST",
          body: formData,
        });

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "invoice.pdf";
        a.click();

        URL.revokeObjectURL(url);
      }
    </script>
  </body>
</html>
